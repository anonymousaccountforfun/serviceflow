name: ProService credential probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/proservice-credential-probe-trigger.txt'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report credential presence only
        shell: bash
        env:
          OPENAI_PRESENT: ${{ secrets.OPENAI_API_KEY != '' }}
          AI_GATEWAY_PRESENT: ${{ secrets.AI_GATEWAY_API_KEY != '' }}
          VERCEL_PRESENT: ${{ secrets.VERCEL_TOKEN != '' }}
          TS_AUTHKEY_PRESENT: ${{ secrets.TS_AUTHKEY != '' }}
          TAILSCALE_AUTHKEY_PRESENT: ${{ secrets.TAILSCALE_AUTHKEY != '' }}
          GH_PAT_PRESENT: ${{ secrets.GH_PAT != '' }}
        run: |
          {
            echo "OPENAI_API_KEY=$OPENAI_PRESENT"
            echo "AI_GATEWAY_API_KEY=$AI_GATEWAY_PRESENT"
            echo "VERCEL_TOKEN=$VERCEL_PRESENT"
            echo "TS_AUTHKEY=$TS_AUTHKEY_PRESENT"
            echo "TAILSCALE_AUTHKEY=$TAILSCALE_AUTHKEY_PRESENT"
            echo "GH_PAT=$GH_PAT_PRESENT"
          } | tee credential-presence.txt
      - name: Upload presence report
        uses: actions/upload-artifact@v4
        with:
          name: proservice-credential-presence
          path: credential-presence.txt
          retention-days: 1
