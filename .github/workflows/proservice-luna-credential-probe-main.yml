name: ProService Luna credential probe main

on:
  push:
    branches: [main]
    paths:
      - '.github/proservice-luna-credential-probe-main-trigger.txt'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Execute one non-confidential Luna Max request
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          key=os.environ.get('OPENAI_API_KEY','')
          print('openai_key_configured='+str(bool(key)).lower())
          if not key:
              raise SystemExit(0)
          body=json.dumps({'model':'gpt-5.6-luna','input':'Return exactly: GITHUB_LUNA_READY','reasoning':{'effort':'max'},'max_output_tokens':32,'store':False}).encode()
          req=urllib.request.Request('https://api.openai.com/v1/responses', data=body, method='POST', headers={'Authorization':'Bearer '+key,'Content-Type':'application/json'})
          try:
              with urllib.request.urlopen(req, timeout=180) as r:
                  print('http_status='+str(r.status))
                  print('response='+r.read().decode('utf-8','replace')[:4000])
          except urllib.error.HTTPError as e:
              print('http_status='+str(e.code))
              print('response='+e.read().decode('utf-8','replace')[:4000])
          PY
