name: ProService runner probe

on:
  push:
    branches: [main]
    paths:
      - '.github/proservice-runner-probe-trigger-main.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-self-hosted:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Capture non-secret runner diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe-output
          {
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner_name=${RUNNER_NAME:-unknown}"
            echo "runner_os=${RUNNER_OS:-unknown}"
            echo "runner_arch=${RUNNER_ARCH:-unknown}"
            echo "hostname=$(hostname)"
            echo "whoami=$(whoami)"
            echo "pwd=$(pwd)"
            echo "uname=$(uname -a)"
            echo "codex=$(command -v codex || true)"
            echo "python3=$(command -v python3 || true)"
            echo "tailscale=$(command -v tailscale || true)"
            if command -v tailscale >/dev/null 2>&1; then
              tailscale status --json 2>/dev/null | python3 - <<'PY'
import json,sys
try:
    d=json.load(sys.stdin); s=d.get('Self',{})
    print('tailscale_hostname='+str(s.get('HostName')))
    print('tailscale_dns='+str(s.get('DNSName')))
    print('tailscale_ips='+str(s.get('TailscaleIPs')))
    print('tailscale_online='+str(s.get('Online')))
except Exception as e:
    print('tailscale_status_error='+repr(e))
PY
            fi
            echo "codex_login_status_begin"
            codex login status 2>&1 || true
            echo "codex_login_status_end"
          } > probe-output/runner.txt
          cat probe-output/runner.txt
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: proservice-runner-probe
          path: probe-output/runner.txt
          retention-days: 1
