name: ProService runner probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.proservice-runner-probe'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  github-hosted-control:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Confirm workflow and protected credential availability
        shell: bash
        run: |
          echo 'GitHub-hosted control job reached.'
          [ -n "${OPENAI_API_KEY:-}" ] && echo 'openai_key=present' || echo 'openai_key=absent'
          [ -n "${CODEX_API_KEY:-}" ] && echo 'codex_key=present' || echo 'codex_key=absent'
          [ -n "${ANTHROPIC_API_KEY:-}" ] && echo 'anthropic_key=present' || echo 'anthropic_key=absent'

  self-hosted-probe:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Confirm a compatible runner exists
        shell: bash
        run: |
          set -euo pipefail
          echo 'Self-hosted runner reached.'
          if [ "$(uname -s)" = 'Darwin' ]; then echo 'platform=macOS'; else echo 'platform=non-macOS'; fi
          command -v python3 >/dev/null
          if command -v codex >/dev/null 2>&1; then echo 'codex=present'; else echo 'codex=absent'; fi
          if command -v tailscale >/dev/null 2>&1; then echo 'tailscale=present'; else echo 'tailscale=absent'; fi
