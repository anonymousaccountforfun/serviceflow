name: ProService runner probe

on:
  push:
    branches: [main]
    paths:
      - '.github/proservice-runner-probe-trigger-main.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-self-hosted:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Capture non-secret runner diagnostics
        shell: bash
        run: |
          set -u
          mkdir -p probe-output
          {
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner_name=${RUNNER_NAME:-unknown}"
            echo "runner_os=${RUNNER_OS:-unknown}"
            echo "runner_arch=${RUNNER_ARCH:-unknown}"
            echo "hostname=$(hostname)"
            echo "whoami=$(whoami)"
            echo "pwd=$(pwd)"
            echo "uname=$(uname -a)"
            for tool in codex python3 tailscale ssh git; do
              if command -v "$tool" >/dev/null 2>&1; then
                echo "$tool=$(command -v "$tool")"
              else
                echo "$tool=missing"
              fi
            done
            if command -v tailscale >/dev/null 2>&1; then
              echo "tailscale_status_begin"
              tailscale status 2>&1 || true
              echo "tailscale_status_end"
            fi
            if command -v codex >/dev/null 2>&1; then
              echo "codex_version=$(codex --version 2>&1 || true)"
              echo "codex_login_status_begin"
              codex login status 2>&1 || true
              echo "codex_login_status_end"
            fi
          } > probe-output/runner.txt
          cat probe-output/runner.txt
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: proservice-runner-probe
          path: probe-output/runner.txt
          retention-days: 1
