name: ProService runner probe

on:
  push:
    branches: [main]
    paths:
      - '.github/proservice-runner-probe-trigger-main.txt'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  github-hosted-control:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Report GitHub Actions control-plane result
        shell: bash
        run: |
          set -euo pipefail
          openai=absent; codex_key=absent; anthropic=absent
          [ -n "${OPENAI_API_KEY:-}" ] && openai=present
          [ -n "${CODEX_API_KEY:-}" ] && codex_key=present
          [ -n "${ANTHROPIC_API_KEY:-}" ] && anthropic=present
          body="GitHub-hosted control reached at $(date -u +%Y-%m-%dT%H:%M:%SZ). OPENAI_API_KEY=${openai}; CODEX_API_KEY=${codex_key}; ANTHROPIC_API_KEY=${anthropic}."
          payload=$(python3 -c 'import json,os; print(json.dumps({"body": os.environ["BODY"]}))' BODY="$body")
          curl --fail-with-body -sS -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/1/comments" \
            -d "$payload" >/dev/null

  self-hosted-probe:
    runs-on: self-hosted
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Report self-hosted runner diagnostics
        shell: bash
        run: |
          set -u
          host=$(hostname 2>/dev/null || echo unknown)
          user=$(whoami 2>/dev/null || echo unknown)
          os=$(uname -s 2>/dev/null || echo unknown)
          arch=$(uname -m 2>/dev/null || echo unknown)
          codex=absent; tailscale=absent; python=absent
          command -v codex >/dev/null 2>&1 && codex=present
          command -v tailscale >/dev/null 2>&1 && tailscale=present
          command -v python3 >/dev/null 2>&1 && python=present
          ts='not-available'
          if command -v tailscale >/dev/null 2>&1; then
            ts=$(tailscale status --self --json 2>/dev/null | python3 -c 'import json,sys; d=json.load(sys.stdin); s=d.get("Self",{}); print("host="+str(s.get("HostName"))+" dns="+str(s.get("DNSName"))+" ips="+str(s.get("TailscaleIPs"))+" online="+str(s.get("Online")))' 2>/dev/null || echo unavailable)
          fi
          login='not-available'
          if command -v codex >/dev/null 2>&1; then login=$(codex login status 2>&1 | tail -c 500 || true); fi
          body="Self-hosted runner reached at $(date -u +%Y-%m-%dT%H:%M:%SZ). runner=${RUNNER_NAME:-unknown}; os=${RUNNER_OS:-$os}; arch=${RUNNER_ARCH:-$arch}; hostname=${host}; user=${user}; python3=${python}; codex=${codex}; tailscale=${tailscale}; tailscale_self=${ts}; codex_login=${login}."
          payload=$(BODY="$body" python3 -c 'import json,os; print(json.dumps({"body": os.environ["BODY"]}))')
          curl --fail-with-body -sS -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/1/comments" \
            -d "$payload" >/dev/null
