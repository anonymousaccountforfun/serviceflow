name: ProService bootstrap direct diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/proservice-bootstrap-direct.yml'
      - '.github/proservice-bootstrap-direct-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Test existing private execution bridge
        shell: bash
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          MAC_SSH_PRIVATE_KEY: ${{ secrets.MAC_SSH_PRIVATE_KEY }}
          PROSERVICE_SSH_PRIVATE_KEY: ${{ secrets.PROSERVICE_SSH_PRIVATE_KEY }}
        run: |
          set -u
          bool() { if [ -n "${1:-}" ]; then echo true; else echo false; fi; }
          AUTHKEY="${TAILSCALE_AUTHKEY:-${TS_AUTHKEY:-}}"
          SSHKEY="${PROSERVICE_SSH_PRIVATE_KEY:-${MAC_SSH_PRIVATE_KEY:-${SSH_PRIVATE_KEY:-}}}"
          HAS_TS=$(bool "$AUTHKEY")
          HAS_MODEL=$( [ -n "${OPENAI_API_KEY:-${CODEX_API_KEY:-}}" ] && echo true || echo false )
          HAS_SSH_KEY=$(bool "$SSHKEY")
          TS_UP=false
          MAC_STUDIO_PING=false
          MINI_01_PING=false
          MINI_02_PING=false
          MAC_STUDIO_SSH_PORT=false
          MINI_01_SSH_PORT=false
          MINI_02_SSH_PORT=false
          MINI_01_LOGIN=false
          MINI_02_LOGIN=false
          STUDIO_LOGIN=false

          if [ -n "$SSHKEY" ]; then
            mkdir -p "$HOME/.ssh"
            chmod 700 "$HOME/.ssh"
            printf '%s\n' "$SSHKEY" > "$HOME/.ssh/proservice_key"
            chmod 600 "$HOME/.ssh/proservice_key"
          fi

          if [ -n "$AUTHKEY" ]; then
            curl -fsSL https://tailscale.com/install.sh | sh >/dev/null 2>&1
            if sudo tailscale up --authkey="$AUTHKEY" --hostname="proservice-gh-${GITHUB_RUN_ID}" --accept-dns=true >/dev/null 2>&1; then
              TS_UP=true
              tailscale ping --timeout=5s mac-studio >/dev/null 2>&1 && MAC_STUDIO_PING=true || true
              tailscale ping --timeout=5s mini-01 >/dev/null 2>&1 && MINI_01_PING=true || true
              tailscale ping --timeout=5s mini-02 >/dev/null 2>&1 && MINI_02_PING=true || true
              nc -z -w 5 mac-studio 22 >/dev/null 2>&1 && MAC_STUDIO_SSH_PORT=true || true
              nc -z -w 5 mini-01 22 >/dev/null 2>&1 && MINI_01_SSH_PORT=true || true
              nc -z -w 5 mini-02 22 >/dev/null 2>&1 && MINI_02_SSH_PORT=true || true
              SSH_OPTS='-o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=6'
              if [ -n "$SSHKEY" ]; then
                SSH_OPTS="$SSH_OPTS -i $HOME/.ssh/proservice_key"
                ssh $SSH_OPTS satoshiclawdomoto@mini-01 'true' >/dev/null 2>&1 && MINI_01_LOGIN=true || true
                ssh $SSH_OPTS brianmacmini2@mini-02 'true' >/dev/null 2>&1 && MINI_02_LOGIN=true || true
                for u in brianhughes brian admin; do ssh $SSH_OPTS "$u@mac-studio" 'true' >/dev/null 2>&1 && STUDIO_LOGIN=true && break || true; done
              else
                tailscale ssh satoshiclawdomoto@mini-01 'true' >/dev/null 2>&1 && MINI_01_LOGIN=true || true
                tailscale ssh brianmacmini2@mini-02 'true' >/dev/null 2>&1 && MINI_02_LOGIN=true || true
                for u in brianhughes brian admin; do tailscale ssh "$u@mac-studio" 'true' >/dev/null 2>&1 && STUDIO_LOGIN=true && break || true; done
              fi
            fi
          fi

          mkdir -p .github
          {
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "HAS_TAILSCALE_CREDENTIAL=$HAS_TS"
            echo "HAS_MODEL_CREDENTIAL=$HAS_MODEL"
            echo "HAS_SSH_KEY=$HAS_SSH_KEY"
            echo "TAILSCALE_CONNECTED=$TS_UP"
            echo "MAC_STUDIO_REACHABLE=$MAC_STUDIO_PING"
            echo "MINI_01_REACHABLE=$MINI_01_PING"
            echo "MINI_02_REACHABLE=$MINI_02_PING"
            echo "MAC_STUDIO_SSH_PORT=$MAC_STUDIO_SSH_PORT"
            echo "MINI_01_SSH_PORT=$MINI_01_SSH_PORT"
            echo "MINI_02_SSH_PORT=$MINI_02_SSH_PORT"
            echo "MAC_STUDIO_LOGIN=$STUDIO_LOGIN"
            echo "MINI_01_LOGIN=$MINI_01_LOGIN"
            echo "MINI_02_LOGIN=$MINI_02_LOGIN"
          } > .github/proservice-bootstrap-direct-result.txt

      - name: Commit boolean-only result
        shell: bash
        run: |
          git config user.name 'proservice-bootstrap-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/proservice-bootstrap-direct-result.txt
          git commit -m 'Record ProService bootstrap bridge result' || exit 0
          git push origin HEAD:main
