name: ProService tailnet credential probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/proservice-tailnet-secret-probe-trigger.txt'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
      TAILSCALE_OAUTH_SECRET: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
    steps:
      - name: Report credential capability without exposing values
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, json
          out={
            'authkeyConfigured': bool(os.getenv('TS_AUTHKEY') or os.getenv('TAILSCALE_AUTHKEY')),
            'oauthConfigured': bool((os.getenv('TS_OAUTH_CLIENT_ID') and os.getenv('TS_OAUTH_SECRET')) or (os.getenv('TAILSCALE_OAUTH_CLIENT_ID') and os.getenv('TAILSCALE_OAUTH_SECRET'))),
          }
          print('TAILNET_SECRET_CAPABILITY='+json.dumps(out,separators=(',',':')))
          PY
