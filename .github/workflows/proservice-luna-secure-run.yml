name: ProService Luna secure run

on:
  pull_request:
    branches: [main]
    paths:
      - 'orchestration/prompts/**'
      - '.github/proservice-luna-run-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  run-luna:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          token_json=$(curl --silent --show-error --fail \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=proservice-ceo-research-os-v1")
          token=$(printf '%s' "$token_json" | jq -r '.value')
          test -n "$token" && test "$token" != "null"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Execute encrypted Luna Max threads in parallel
        shell: bash
        env:
          GH_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          ENDPOINT: https://proservice-luna-secure-control.vercel.app/execute
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p psos-results psos-status
          files=(orchestration/prompts/*.enc.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No encrypted prompts found" >&2
            exit 2
          fi

          run_one() {
            local file="$1"
            local id
            id=$(basename "$file" .enc.json)
            jq -n --arg id "$id" --slurpfile payload "$file" \
              '{id:$id,payload:$payload[0]}' > "psos-status/${id}.request.json"
            http=$(curl --silent --show-error --retry 2 --retry-all-errors \
              --connect-timeout 30 --max-time 310 \
              -X POST "$ENDPOINT" \
              -H "Authorization: Bearer $GH_OIDC_TOKEN" \
              -H 'Content-Type: application/json' \
              --data-binary @"psos-status/${id}.request.json" \
              -o "psos-results/${id}.enc.json" \
              -w '%{http_code}')
            printf '%s\n' "$http" > "psos-status/${id}.http"
            if [ "$http" != "200" ]; then
              echo "Thread $id failed with HTTP $http" >&2
              return 1
            fi
            jq -e '.v == 1 and .alg == "A256GCM" and (.data|type == "string")' \
              "psos-results/${id}.enc.json" >/dev/null
          }

          pids=()
          names=()
          for file in "${files[@]}"; do
            run_one "$file" &
            pids+=("$!")
            names+=("$(basename "$file")")
          done

          rc=0
          for i in "${!pids[@]}"; do
            if ! wait "${pids[$i]}"; then
              echo "Failed: ${names[$i]}" >&2
              rc=1
            fi
          done
          exit "$rc"

      - name: Upload encrypted results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proservice-luna-secure-results
          path: |
            psos-results/
            psos-status/*.http
          if-no-files-found: error
          retention-days: 1
