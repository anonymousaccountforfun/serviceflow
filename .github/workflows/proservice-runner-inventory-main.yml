name: ProService self-hosted runner inventory

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/proservice-runner-inventory-trigger.txt'

permissions:
  contents: read
  actions: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query repository runners
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -u
          mkdir -p inventory-output
          status=$(curl -sS -o inventory-output/runners.json -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/runners")
          echo "http_status=$status" | tee inventory-output/summary.txt
          python3 - <<'PY' | tee -a inventory-output/summary.txt
import json
from pathlib import Path
p=Path('inventory-output/runners.json')
try:
    data=json.loads(p.read_text())
except Exception as exc:
    print('json_error='+repr(exc))
    print(p.read_text()[:2000] if p.exists() else '<missing>')
    raise SystemExit(0)
if isinstance(data, dict) and 'runners' in data:
    print('total_count='+str(data.get('total_count',0)))
    for runner in data.get('runners',[]):
        print(json.dumps({
            'id': runner.get('id'),
            'name': runner.get('name'),
            'os': runner.get('os'),
            'status': runner.get('status'),
            'busy': runner.get('busy'),
            'labels': [x.get('name') for x in runner.get('labels',[])],
        }, sort_keys=True))
else:
    print(json.dumps(data, sort_keys=True)[:4000])
PY
          cat inventory-output/summary.txt
      - name: Upload runner inventory
        uses: actions/upload-artifact@v4
        with:
          name: proservice-runner-inventory
          path: inventory-output/
          retention-days: 1
