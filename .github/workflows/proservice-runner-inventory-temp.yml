name: ProService temporary runner inventory

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/proservice-runner-inventory-temp.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query repository self-hosted runners
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -uo pipefail
          status=$(curl -sS -o runners.json -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/runners")
          echo "http_status=$status"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('runners.json')
          data=json.loads(p.read_text()) if p.exists() else {'error':'missing'}
          if isinstance(data, dict) and 'runners' in data:
              print('total_count=',data.get('total_count'))
              for r in data.get('runners',[]):
                  print(json.dumps({
                      'id':r.get('id'), 'name':r.get('name'), 'os':r.get('os'),
                      'status':r.get('status'), 'busy':r.get('busy'),
                      'labels':[x.get('name') for x in r.get('labels',[])]
                  }, sort_keys=True))
          else:
              print(json.dumps(data, sort_keys=True)[:4000])
          PY

  probe-self-hosted:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Capture non-secret runner diagnostics
        shell: bash
        run: |
          set -uo pipefail
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "runner_name=${RUNNER_NAME:-unknown}"
          echo "runner_os=${RUNNER_OS:-unknown}"
          echo "runner_arch=${RUNNER_ARCH:-unknown}"
          echo "hostname=$(hostname)"
          echo "whoami=$(whoami)"
          echo "uname=$(uname -a)"
          for bin in tailscale ssh codex python3 uv git; do
            echo "$bin=$(command -v "$bin" || true)"
          done
          if command -v tailscale >/dev/null 2>&1; then tailscale status || true; fi
          if command -v codex >/dev/null 2>&1; then codex login status || true; fi
