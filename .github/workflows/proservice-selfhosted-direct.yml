name: ProService self-hosted runner diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/proservice-selfhosted-direct.yml'
      - '.github/proservice-selfhosted-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Record boolean-only self-hosted capability status
        shell: bash
        run: |
          mkdir -p .github
          {
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "SELF_HOSTED_RUNNER=true"
            echo "RUNNER_MACOS=$([ "${RUNNER_OS:-}" = 'macOS' ] && echo true || echo false)"
            echo "HAS_TAILSCALE=$(command -v tailscale >/dev/null 2>&1 && echo true || echo false)"
            echo "HAS_CODEX=$(command -v codex >/dev/null 2>&1 && echo true || echo false)"
            echo "HAS_PYTHON=$(command -v python3 >/dev/null 2>&1 && echo true || echo false)"
            echo "HAS_RESEARCH_OS=$([ -d "$HOME/work/ProService_CEO_Research_OS" ] && echo true || echo false)"
          } > .github/proservice-selfhosted-direct-result.txt
      - name: Commit boolean-only result
        shell: bash
        run: |
          git config user.name 'proservice-selfhosted-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/proservice-selfhosted-direct-result.txt
          git commit -m 'Record ProService self-hosted runner result' || exit 0
          git push origin HEAD:main
