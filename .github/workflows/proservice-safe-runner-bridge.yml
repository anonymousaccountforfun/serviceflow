name: ProService safe runner bridge

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query repository runner inventory
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS -o runners.json -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/runners")
          echo "runner_inventory_http_status=$status"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('runners.json')
          try:
              data = json.loads(p.read_text())
          except Exception:
              print('runner_inventory_parseable=false')
              raise SystemExit(0)
          if isinstance(data, dict) and isinstance(data.get('runners'), list):
              print(f"runner_count={data.get('total_count', len(data['runners']))}")
              for r in data['runners']:
                  labels = [x.get('name') for x in r.get('labels', [])]
                  print(json.dumps({
                      'name': r.get('name'),
                      'os': r.get('os'),
                      'status': r.get('status'),
                      'busy': r.get('busy'),
                      'labels': labels,
                  }, sort_keys=True))
          else:
              print('runner_inventory_available=false')
          PY

  probe:
    runs-on: [self-hosted]
    timeout-minutes: 5
    steps:
      - name: Report non-sensitive Mac runner capabilities
        shell: bash
        run: |
          set -euo pipefail
          bool_command() {
            if command -v "$1" >/dev/null 2>&1; then echo true; else echo false; fi
          }
          echo "runner_name=${RUNNER_NAME:-unknown}"
          echo "runner_os=${RUNNER_OS:-unknown}"
          echo "runner_arch=${RUNNER_ARCH:-unknown}"
          echo "host_os=$(uname -s)"
          echo "host_arch=$(uname -m)"
          echo "tailscale_installed=$(bool_command tailscale)"
          if command -v tailscale >/dev/null 2>&1 && tailscale ip -4 >/dev/null 2>&1; then
            echo "tailnet_connected=true"
          else
            echo "tailnet_connected=false"
          fi
          echo "ssh_installed=$(bool_command ssh)"
          echo "python_installed=$(bool_command python3)"
          echo "uv_installed=$(bool_command uv)"
          echo "codex_installed=$(bool_command codex)"
          if command -v codex >/dev/null 2>&1 && codex login status >/dev/null 2>&1; then
            echo "codex_authenticated=true"
          else
            echo "codex_authenticated=false"
          fi
          if [ -d "$HOME/work/ProService_CEO_Research_OS" ]; then
            echo "research_os_workdir_present=true"
          else
            echo "research_os_workdir_present=false"
          fi
          found_archive=false
          for root in "$HOME/Downloads" "$HOME/Desktop" "$HOME/Documents"; do
            if [ -d "$root" ] && find "$root" -maxdepth 2 -type f -name 'ProService_CEO_Research_OS_v0.2.0.zip' -print -quit 2>/dev/null | grep -q .; then
              found_archive=true
              break
            fi
          done
          echo "research_os_archive_present=$found_archive"
