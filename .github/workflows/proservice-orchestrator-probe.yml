name: ProService orchestrator probe

on:
  push:
    branches:
      - proservice-orchestrator-probe
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query repository self-hosted runners
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -uo pipefail
          echo "repo=$REPO"
          status=$(curl -sS -o runners.json -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/runners")
          echo "http_status=$status"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('runners.json')
          try:
              data=json.loads(p.read_text())
          except Exception as e:
              print('json_error=',repr(e))
              print(p.read_text()[:2000] if p.exists() else '<missing>')
              raise SystemExit(0)
          if isinstance(data, dict) and 'runners' in data:
              print('total_count=',data.get('total_count'))
              for r in data.get('runners',[]):
                  print(json.dumps({
                      'id':r.get('id'),
                      'name':r.get('name'),
                      'os':r.get('os'),
                      'status':r.get('status'),
                      'busy':r.get('busy'),
                      'labels':[x.get('name') for x in r.get('labels',[])],
                  }, sort_keys=True))
          else:
              print(json.dumps(data, sort_keys=True)[:4000])
          PY

  probe:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Identify runner and capabilities
        shell: bash
        run: |
          set -uo pipefail
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "hostname=$(hostname)"
          echo "whoami=$(whoami)"
          echo "uname=$(uname -a)"
          echo "pwd=$(pwd)"
          echo "runner_name=${RUNNER_NAME:-}"
          echo "runner_os=${RUNNER_OS:-}"
          echo "runner_arch=${RUNNER_ARCH:-}"
          for bin in tailscale tailscaled ssh codex python3 uv git; do
            if command -v "$bin" >/dev/null 2>&1; then
              echo "$bin=$(command -v "$bin")"
            else
              echo "$bin=MISSING"
            fi
          done
          if command -v tailscale >/dev/null 2>&1; then
            echo "--- tailscale status ---"
            tailscale status || true
          fi
          if command -v codex >/dev/null 2>&1; then
            echo "--- codex version ---"
            codex --version || true
            echo "--- codex auth status ---"
            codex login status || true
          fi
          echo "--- relevant directories ---"
          for p in "$HOME/work" "$HOME/Downloads" "$HOME/Desktop"; do
            if [ -d "$p" ]; then
              echo "DIR $p"
              find "$p" -maxdepth 2 -iname '*ProService*Research*OS*' -print 2>/dev/null | head -50 || true
            fi
          done
