name: ProService cluster probe

on:
  push:
    branches:
      - proservice-orchestrator-probe
  workflow_dispatch:

jobs:
  activation:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Confirm workflow activation
        run: echo "Workflow active"

  mac-runner:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Check runner capabilities without exposing network details
        shell: bash
        run: |
          set -u
          echo "runner_os=${RUNNER_OS:-unknown}"
          echo "runner_arch=${RUNNER_ARCH:-unknown}"
          echo "python=$(command -v python3 >/dev/null && echo yes || echo no)"
          echo "codex=$(command -v codex >/dev/null && echo yes || echo no)"
          echo "tailscale=$(command -v tailscale >/dev/null && echo yes || echo no)"
          echo "research_os=$(test -d "$HOME/work/ProService_CEO_Research_OS" && echo yes || echo no)"
