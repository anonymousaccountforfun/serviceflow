name: ProService runner inventory

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query repository self-hosted runners
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -uo pipefail
          echo "repo=$REPO"
          echo "runner_context_name=${RUNNER_NAME:-}"
          echo "runner_context_os=${RUNNER_OS:-}"
          status=$(curl -sS -o runners.json -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/runners")
          echo "http_status=$status"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('runners.json')
          try:
              data=json.loads(p.read_text())
          except Exception as e:
              print('json_error=',repr(e))
              print(p.read_text()[:2000] if p.exists() else '<missing>')
              raise SystemExit(0)
          if isinstance(data, dict) and 'runners' in data:
              print('total_count=',data.get('total_count'))
              for r in data.get('runners',[]):
                  print(json.dumps({
                      'id':r.get('id'),
                      'name':r.get('name'),
                      'os':r.get('os'),
                      'status':r.get('status'),
                      'busy':r.get('busy'),
                      'labels':[x.get('name') for x in r.get('labels',[])],
                  }, sort_keys=True))
          else:
              print(json.dumps(data, sort_keys=True)[:4000])
          PY
