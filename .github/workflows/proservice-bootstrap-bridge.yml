name: ProService bootstrap bridge

on:
  push:
    branches:
      - proservice-orchestrator-probe
    paths:
      - '.github/workflows/proservice-bootstrap-bridge.yml'
      - '.github/proservice-bootstrap-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Record non-secret credential availability
        shell: bash
        env:
          HAS_TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY != '' }}
          HAS_TS_AUTHKEY: ${{ secrets.TS_AUTHKEY != '' }}
          HAS_TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID != '' }}
          HAS_TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET != '' }}
          HAS_TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID != '' }}
          HAS_TAILSCALE_OAUTH_SECRET: ${{ secrets.TAILSCALE_OAUTH_SECRET != '' }}
          HAS_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
          HAS_CODEX_API_KEY: ${{ secrets.CODEX_API_KEY != '' }}
        run: |
          set -euo pipefail
          mkdir -p probe-output
          {
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner=${RUNNER_NAME:-unknown}"
            echo "os=${RUNNER_OS:-unknown}"
            echo "arch=${RUNNER_ARCH:-unknown}"
            echo "HAS_TAILSCALE_AUTHKEY=$HAS_TAILSCALE_AUTHKEY"
            echo "HAS_TS_AUTHKEY=$HAS_TS_AUTHKEY"
            echo "HAS_TS_OAUTH_CLIENT_ID=$HAS_TS_OAUTH_CLIENT_ID"
            echo "HAS_TS_OAUTH_SECRET=$HAS_TS_OAUTH_SECRET"
            echo "HAS_TAILSCALE_OAUTH_CLIENT_ID=$HAS_TAILSCALE_OAUTH_CLIENT_ID"
            echo "HAS_TAILSCALE_OAUTH_SECRET=$HAS_TAILSCALE_OAUTH_SECRET"
            echo "HAS_OPENAI_API_KEY=$HAS_OPENAI_API_KEY"
            echo "HAS_CODEX_API_KEY=$HAS_CODEX_API_KEY"
          } | tee probe-output/credential-presence.txt

      - name: Join tailnet using TAILSCALE_AUTHKEY
        if: ${{ secrets.TAILSCALE_AUTHKEY != '' }}
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          tags: tag:ci

      - name: Join tailnet using TS_AUTHKEY
        if: ${{ secrets.TAILSCALE_AUTHKEY == '' && secrets.TS_AUTHKEY != '' }}
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          tags: tag:ci

      - name: Join tailnet using TS OAuth credentials
        if: ${{ secrets.TAILSCALE_AUTHKEY == '' && secrets.TS_AUTHKEY == '' && secrets.TS_OAUTH_CLIENT_ID != '' && secrets.TS_OAUTH_SECRET != '' }}
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Join tailnet using TAILSCALE OAuth credentials
        if: ${{ secrets.TAILSCALE_AUTHKEY == '' && secrets.TS_AUTHKEY == '' && secrets.TS_OAUTH_CLIENT_ID == '' && secrets.TAILSCALE_OAUTH_CLIENT_ID != '' && secrets.TAILSCALE_OAUTH_SECRET != '' }}
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci

      - name: Probe tailnet and Mac hosts
        if: ${{ secrets.TAILSCALE_AUTHKEY != '' || secrets.TS_AUTHKEY != '' || (secrets.TS_OAUTH_CLIENT_ID != '' && secrets.TS_OAUTH_SECRET != '') || (secrets.TAILSCALE_OAUTH_CLIENT_ID != '' && secrets.TAILSCALE_OAUTH_SECRET != '') }}
        shell: bash
        run: |
          set -uo pipefail
          {
            echo '--- tailscale status ---'
            tailscale status || true
            echo '--- host probes ---'
            for host in mac-studio mini-01 mini-02; do
              echo "### $host"
              tailscale ping --timeout=5s "$host" || true
              getent hosts "$host" || true
              nc -vz -w 5 "$host" 22 || true
            done
          } 2>&1 | tee probe-output/tailnet.txt

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: proservice-bootstrap-bridge
          path: probe-output/
          retention-days: 1
