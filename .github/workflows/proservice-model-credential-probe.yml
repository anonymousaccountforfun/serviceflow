name: ProService model credential probe

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Report protected model credential availability
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${OPENAI_API_KEY:-}" ] && echo 'openai_key=present' || echo 'openai_key=absent'
          [ -n "${CODEX_API_KEY:-}" ] && echo 'codex_key=present' || echo 'codex_key=absent'
          [ -n "${ANTHROPIC_API_KEY:-}" ] && echo 'anthropic_key=present' || echo 'anthropic_key=absent'
