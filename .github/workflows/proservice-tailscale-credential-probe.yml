name: Temporary ProService Tailscale credential probe

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
      TAILSCALE_OAUTH_SECRET: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
    steps:
      - name: Report protected credential availability
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${TAILSCALE_AUTHKEY:-}" ] && echo 'tailscale_authkey=present' || echo 'tailscale_authkey=absent'
          [ -n "${TS_AUTHKEY:-}" ] && echo 'ts_authkey=present' || echo 'ts_authkey=absent'
          if [ -n "${TS_OAUTH_CLIENT_ID:-}" ] && [ -n "${TS_OAUTH_SECRET:-}" ]; then echo 'ts_oauth=present'; else echo 'ts_oauth=absent'; fi
          if [ -n "${TAILSCALE_OAUTH_CLIENT_ID:-}" ] && [ -n "${TAILSCALE_OAUTH_SECRET:-}" ]; then echo 'tailscale_oauth=present'; else echo 'tailscale_oauth=absent'; fi
